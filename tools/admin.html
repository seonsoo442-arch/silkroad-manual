<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>메뉴얼 관리 (로컬)</title>
<style>
:root{--bg:#f6f7f9;--s:#fff;--t:#1d2433;--m:#667085;--l:#e3e6ec;--b:#1f5fbf;--bs:#e8f0fc;--ok:#1a7f4b;--er:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--s:#1a202a;--t:#e6e9ef;--m:#9aa4b5;--l:#2b3342;--b:#6ea3f5;--bs:#1e2c45;--ok:#4cc38a;--er:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 "Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--m);margin:0 0 20px}
.card{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px}
.drop{border:2px dashed var(--l);border-radius:12px;padding:28px;text-align:center;color:var(--m);cursor:pointer}
.drop.over,.drop:focus-visible{border-color:var(--b);background:var(--bs);outline:none}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}
.btn{padding:9px 18px;border:0;border-radius:8px;background:var(--b);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:transparent;color:var(--t);border:1px solid var(--l);padding:4px 10px;margin:0;font-weight:400}
.msg{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--bs)}
.msg.ok{color:var(--ok)}.msg.er{color:var(--er)}.msg.warn{color:var(--er);background:transparent;border:1px solid var(--er)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--l)}th{color:var(--m)}
small{color:var(--m)}
.pickrow{display:grid;grid-template-columns:1fr 140px auto;gap:8px;align-items:end}@media(max-width:600px){.pickrow{grid-template-columns:1fr 1fr}}
.pickrow .btn{margin:0}
.bulk{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bulk .btn.sec{padding:6px 12px}
.order{list-style:none;margin:12px 0 0;padding:0;border:1px solid var(--l);border-radius:8px;counter-reset:n}
.order li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--l);background:var(--s);counter-increment:n}
.order li:last-child{border-bottom:0}
.order li::before{content:counter(n) ".";color:var(--m);min-width:22px;text-align:right}
.order li.drag{opacity:.4}.order li.over{box-shadow:inset 0 2px 0 var(--b)}
.order .grip{cursor:grab;color:var(--m);user-select:none;padding:0 2px}
.order .t{flex:1;min-width:0}
.order .t select{width:auto;padding:2px 6px;margin-left:6px}
.order .btn.sec{padding:2px 8px}
.empty{color:var(--m);padding:12px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>메뉴얼 관리 <small>(이 PC에서만 열림)</small></h1>
  <p class="sub">수정한 HWPX를 올리면 변환해서 새 버전으로 등록합니다. 등록 후 <code>site/</code> 폴더를 배포하면 반영됩니다.</p>

  <div class="card">
    <h2>1. 파일 선택</h2>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="HWPX 파일 선택">HWPX 파일을 여기에 끌어놓거나 클릭해서 선택<br><small id="fileInfo"></small></div>
    <input type="file" id="file" accept=".hwpx" hidden>
    <div class="msg warn" id="dupMsg" hidden></div>
  </div>

  <div class="card" id="formCard" hidden>
    <h2>2. 등록 정보</h2>
    <div class="msg" id="matchMsg" hidden></div>
    <div class="row">
      <div><label for="manual">문서</label><select id="manual"></select></div>
      <div><label for="version">버전</label><input id="version" maxlength="30" placeholder="예: 1.1"></div>
    </div>
    <div id="newBox" class="row" hidden>
      <div><label for="newId">새 문서 ID (영문 소문자·숫자·-)</label><input id="newId" maxlength="40" placeholder="예: requirement"></div>
      <div><label for="title">문서 제목</label><input id="title" maxlength="100" placeholder="예: 요구사항 관리"></div>
    </div>
    <label for="note">변경 내용</label>
    <textarea id="note" rows="3" maxlength="500" placeholder="예: 4.2절 화면 캡처 교체, 오류 메시지 표 추가"></textarea>
    <label><input type="checkbox" id="overwrite" style="width:auto"> 같은 버전이 있으면 덮어쓰기</label>
    <button class="btn" id="go">변환하고 등록</button>
    <div class="msg" id="result" hidden></div>
  </div>

  <div class="card" id="mergeCard">
    <h2>문서 병합</h2>
    <p class="sub" style="margin:0">등록된 문서를 골라 원하는 순서로 하나의 HWPX로 합치고, 사이트에 새 문서로 등록합니다. 각 문서는 새 쪽에서 시작합니다.</p>
    <div class="pickrow">
      <div><label for="mPick">문서</label><select id="mPick"></select></div>
      <div><label for="mPickVer">버전</label><select id="mPickVer"></select></div>
      <button class="btn" id="mAdd" type="button">추가</button>
    </div>
    <div class="bulk">
      <button class="btn sec" id="mAddAll" type="button">전체 문서 추가 (최신 버전)</button>
      <button class="btn sec" id="mClear" type="button">목록 비우기</button>
    </div>
    <ol class="order" id="mOrder" aria-label="병합 순서 (끌어서 순서 변경)"></ol>
    <small>≡ 를 끌거나 ▲▼ 버튼으로 순서를 바꿀 수 있습니다. 같은 문서를 여러 번 넣을 수도 있습니다.</small>
    <div class="row">
      <div><label for="mTarget">등록할 곳</label><select id="mTarget"></select></div>
      <div><label for="mVersion">버전</label><input id="mVersion" maxlength="30" value="1.0"></div>
    </div>
    <div class="row" id="mNewBox">
      <div><label for="mId">새 문서 ID (영문 소문자·숫자·-)</label><input id="mId" maxlength="40" placeholder="예: user-guide-all"></div>
      <div><label for="mTitle">문서 제목 (다운로드 파일 이름)</label><input id="mTitle" maxlength="100" placeholder="예: SILKROAD 사용자 메뉴얼 통합본"></div>
    </div>
    <label for="mNote">변경 내용</label>
    <textarea id="mNote" rows="2" maxlength="500" placeholder="비워 두면 병합한 문서 목록이 들어갑니다"></textarea>
    <label><input type="checkbox" id="mOverwrite" style="width:auto"> 같은 버전이 있으면 덮어쓰기</label>
    <button class="btn" id="mGo" type="button">병합하고 등록</button>
    <div class="msg" id="mResult" hidden></div>
  </div>

  <div class="card">
    <h2>등록된 문서</h2>
    <div id="list"></div>
  </div>
</div>
<script>
const SESSION='__SESSION__';
const $=(i)=>document.getElementById(i);
let upload=null, manuals=[];
const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{...(o.headers||{}),'X-Session':SESSION}});const j=await r.json();if(!r.ok)throw new Error(j.error||'오류');return j;};
const mb=(n)=>(n/1048576).toFixed(1)+'MB';
const show=(el,cls,txt)=>{el.hidden=false;el.className='msg '+cls;el.textContent=txt;};

async function refresh(){
  manuals=(await api('/api/manuals')).manuals;
  const sel=$('manual');sel.textContent='';
  for(const m of manuals){const o=document.createElement('option');o.value=m.id;o.textContent=`${m.title} (${m.id})`;sel.append(o);}
  const n=document.createElement('option');n.value='__new';n.textContent='+ 새 문서 추가';sel.append(n);
  onManual();
  fillPick();
  const list=$('list');list.textContent='';
  if(!manuals.length){list.textContent='등록된 문서가 없습니다.';return;}
  for(const m of manuals){
    const h=document.createElement('strong');h.textContent=`${m.title} (${m.id})`;list.append(h);
    const t=document.createElement('table');t.innerHTML='<thead><tr><th>버전</th><th>등록일시</th><th>변경 내용</th><th></th></tr></thead>';
    const tb=document.createElement('tbody');
    for(const v of m.versions){
      const tr=document.createElement('tr');
      for(const x of [v.version+(v.version===m.latest?' (최신)':''),new Date(v.date).toLocaleString('ko-KR'),v.note||'-']){const td=document.createElement('td');td.textContent=x;tr.append(td);}
      const td=document.createElement('td');
      const a=document.createElement('a');a.href=`http://127.0.0.1:5173/viewer.html?m=${m.id}&v=${encodeURIComponent(v.version)}`;a.target='_blank';a.textContent='열기 ';td.append(a);
      const d=document.createElement('button');d.className='btn sec';d.textContent='삭제';
      d.onclick=async()=>{if(!confirm(`${m.title} v${v.version} 을(를) 삭제할까요? 되돌릴 수 없습니다.`))return;try{await api('/api/delete',{method:'POST',body:JSON.stringify({id:m.id,version:v.version})});refresh();}catch(e){alert(e.message);}};
      td.append(d);tr.append(td);tb.append(tr);
    }
    t.append(tb);list.append(t);
  }
}
async function onManual(){
  const id=$('manual').value;
  $('newBox').hidden=id!=='__new';
  if(id!=='__new'&&id){const s=await api('/api/suggest?id='+encodeURIComponent(id));$('version').value=s.version;}
  else $('version').value='1.0';
}
$('manual').onchange=onManual;

async function pick(f){
  $('dupMsg').hidden=true;$('result').hidden=true;$('matchMsg').hidden=true;
  if(!f)return;
  if(!/\.hwpx$/i.test(f.name)){alert('HWPX 파일(.hwpx)만 올릴 수 있습니다. HWP는 한글에서 HWPX로 저장 후 올려 주세요.');return;}
  $('fileInfo').textContent=`업로드 중… ${f.name} (${mb(f.size)})`;
  try{
    upload=await api('/api/upload',{method:'POST',headers:{'X-Filename':encodeURIComponent(f.name)},body:f});
    $('fileInfo').textContent=`${upload.name} (${mb(upload.bytes)}) 준비됨`;
    $('formCard').hidden=false;
    if(upload.duplicates.length){const d=upload.duplicates[0];show($('dupMsg'),'warn',`이미 등록된 파일과 내용이 같습니다: ${d.title} v${d.version}. 수정 없이 다시 올린 파일이 아닌지 확인하세요.`);}
    // 파일명으로 같은 문서인지 구분: 일치하면 그 문서의 다음 버전, 아니면 새 문서로 시작
    const g=upload.guess;
    if(g.matchId){
      $('manual').value=g.matchId;
      const m=manuals.find((x)=>x.id===g.matchId);
      show($('matchMsg'),'',`파일명으로 "${m.title}" 문서의 새 버전으로 인식했습니다. 다른 문서라면 아래에서 바꾸세요.`);
    }else{
      $('manual').value='__new';
      show($('matchMsg'),'',`기존 문서와 이름이 달라 새 문서로 등록합니다. (문서 ID·제목을 확인하세요)`);
    }
    await onManual();
    if(!g.matchId){$('newId').value=g.newId;$('title').value=g.newTitle;$('version').value='1.0';}
  }catch(e){upload=null;$('fileInfo').textContent='';show($('dupMsg'),'warn',e.message);}
}
const drop=$('drop'),file=$('file');
drop.onclick=()=>file.click();
drop.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click();}};
file.onchange=()=>pick(file.files[0]);
drop.ondragover=(e)=>{e.preventDefault();drop.classList.add('over');};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=(e)=>{e.preventDefault();drop.classList.remove('over');pick(e.dataTransfer.files[0]);};

$('go').onclick=async()=>{
  if(!upload)return;
  const isNew=$('manual').value==='__new';
  const body={token:upload.token,id:isNew?$('newId').value.trim():$('manual').value,title:isNew?$('title').value.trim():'',version:$('version').value.trim(),note:$('note').value.trim(),overwrite:$('overwrite').checked};
  $('go').disabled=true;show($('result'),'','변환 중입니다… (큰 파일은 몇 분 걸릴 수 있습니다)');
  try{
    const r=await api('/api/register',{method:'POST',body:JSON.stringify(body)});
    const w=Object.keys(r.warnings).length?` / 미처리 요소: ${JSON.stringify(r.warnings)}`:'';
    show($('result'),'ok',`등록 완료: ${r.id} v${r.version} — 제목 ${r.stats.headings}, 표 ${r.stats.tables}, 그림 ${r.stats.images}${r.stats.missingImages?` (누락 ${r.stats.missingImages})`:''}${w}`);
    upload=null;$('fileInfo').textContent='';$('note').value='';file.value='';
    refresh();
  }catch(e){show($('result'),'er',e.message);}
  $('go').disabled=false;
};
// ---------- 문서 병합 ----------
let order=[]; // [{id, version}]
const mById=(id)=>manuals.find((m)=>m.id===id);
function fillPick(){
  const sel=$('mPick'),prev=sel.value;sel.textContent='';
  for(const m of manuals){const o=document.createElement('option');o.value=m.id;o.textContent=`${m.title} (${m.id})`;sel.append(o);}
  if(mById(prev))sel.value=prev;
  fillPickVer();
  const t=$('mTarget'),pt=t.value;t.textContent='';
  const n=document.createElement('option');n.value='__new';n.textContent='+ 새 문서로 등록';t.append(n);
  for(const m of manuals.filter((x)=>x.versions.some((v)=>v.mergedFrom))){const o=document.createElement('option');o.value=m.id;o.textContent=`${m.title} (${m.id})의 새 버전`;t.append(o);}
  if([...t.options].some((o)=>o.value===pt))t.value=pt;
  onTarget();
  order=order.filter((it)=>mById(it.id)?.versions.some((v)=>v.version===it.version));
  renderOrder();
}
function verOptions(sel,m,cur){
  sel.textContent='';
  for(const v of m.versions){const o=document.createElement('option');o.value=v.version;o.textContent=`v${v.version}${v.version===m.latest?' (최신)':''}`;sel.append(o);}
  sel.value=cur??m.latest;
}
function fillPickVer(){const m=mById($('mPick').value);if(m)verOptions($('mPickVer'),m);}
$('mPick').onchange=fillPickVer;
$('mAdd').onclick=()=>{const id=$('mPick').value,version=$('mPickVer').value;if(!id||!version)return;order.push({id,version});renderOrder();};
// 전체 추가: 등록된 문서를 목록 순서대로 최신 버전으로 넣는다. 병합으로 만든 문서는 내용이 겹치므로 뺀다.
$('mAddAll').onclick=()=>{
  const all=manuals.filter((m)=>!m.versions.find((v)=>v.version===m.latest)?.mergedFrom).map((m)=>({id:m.id,version:m.latest}));
  if(order.length&&!confirm(`지금 목록(${order.length}개)을 지우고 전체 문서 ${all.length}개를 최신 버전으로 넣을까요?`))return;
  order=all;renderOrder();
  show($('mResult'),'',`전체 문서 ${all.length}개를 최신 버전으로 추가했습니다.${manuals.length>all.length?` (병합 문서 ${manuals.length-all.length}개는 제외)`:''}`);
};
$('mClear').onclick=()=>{if(order.length&&confirm('병합 목록을 모두 비울까요?')){order=[];renderOrder();$('mResult').hidden=true;}};
async function onTarget(){
  const id=$('mTarget').value;
  $('mNewBox').hidden=id!=='__new';
  if(id!=='__new'){const s=await api('/api/suggest?id='+encodeURIComponent(id));$('mVersion').value=s.version;$('mTitle').value=s.title;}
  else{$('mVersion').value='1.0';}
}
$('mTarget').onchange=onTarget;
let dragFrom=null;
function move(i,j){if(j<0||j>=order.length)return;const [x]=order.splice(i,1);order.splice(j,0,x);renderOrder();}
function renderOrder(){
  const ol=$('mOrder');ol.textContent='';
  if(!order.length){const li=document.createElement('div');li.className='empty';li.textContent='위에서 문서를 골라 [추가]를 누르세요.';ol.append(li);return;}
  order.forEach((it,i)=>{
    const m=mById(it.id);
    const li=document.createElement('li');li.draggable=true;
    const g=document.createElement('span');g.className='grip';g.textContent='≡';g.title='끌어서 순서 변경';g.setAttribute('aria-hidden','true');
    const t=document.createElement('span');t.className='t';t.textContent=m.title;
    const vs=document.createElement('select');vs.setAttribute('aria-label',`${m.title} 버전`);verOptions(vs,m,it.version);vs.onchange=()=>{it.version=vs.value;};t.append(vs);
    const mk=(txt,label,fn,dis)=>{const b=document.createElement('button');b.type='button';b.className='btn sec';b.textContent=txt;b.setAttribute('aria-label',`${m.title} ${label}`);b.disabled=!!dis;b.onclick=fn;return b;};
    li.append(g,t,mk('▲','위로',()=>move(i,i-1),i===0),mk('▼','아래로',()=>move(i,i+1),i===order.length-1),mk('✕','빼기',()=>{order.splice(i,1);renderOrder();}));
    li.ondragstart=(e)=>{dragFrom=i;li.classList.add('drag');e.dataTransfer.effectAllowed='move';};
    li.ondragend=()=>{li.classList.remove('drag');};
    li.ondragover=(e)=>{e.preventDefault();li.classList.add('over');};
    li.ondragleave=()=>li.classList.remove('over');
    li.ondrop=(e)=>{e.preventDefault();li.classList.remove('over');if(dragFrom!==null&&dragFrom!==i)move(dragFrom,i);dragFrom=null;};
    ol.append(li);
  });
}
$('mGo').onclick=async()=>{
  if(order.length<2){show($('mResult'),'er','병합할 문서를 2개 이상 추가하세요.');return;}
  const isNew=$('mTarget').value==='__new';
  const title=$('mTitle').value.trim();
  const note=$('mNote').value.trim()||('병합: '+order.map((it)=>`${mById(it.id).title} v${it.version}`).join(' + ')).slice(0,500);
  const body={items:order,id:isNew?$('mId').value.trim():$('mTarget').value,title,version:$('mVersion').value.trim(),note,overwrite:$('mOverwrite').checked};
  $('mGo').disabled=true;show($('mResult'),'',`${order.length}개 문서를 병합하고 변환하는 중입니다… (큰 문서는 1분 이상 걸릴 수 있습니다)`);
  try{
    const r=await api('/api/merge',{method:'POST',body:JSON.stringify(body)});
    show($('mResult'),'ok',`등록 완료: ${r.id} v${r.version} (${mb(r.bytes)}) — 제목 ${r.stats.headings}, 표 ${r.stats.tables}, 그림 ${r.stats.images}${r.stats.missingImages?` (누락 ${r.stats.missingImages})`:''}. 열람 화면의 [원본(HWPX) 다운로드]로 받을 수 있습니다.`);
    const a=document.createElement('a');a.href=`http://127.0.0.1:5173/viewer.html?m=${r.id}&v=${encodeURIComponent(r.version)}`;a.target='_blank';a.textContent=' 열람 화면 열기';$('mResult').append(a);
    $('mNote').value='';
    await refresh();
  }catch(e){show($('mResult'),'er',e.message);}
  $('mGo').disabled=false;
};

refresh().catch((e)=>{$('list').textContent=e.message;});
</script>
</body>
</html>
